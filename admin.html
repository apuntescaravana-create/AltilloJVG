<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - AltilloJVG</title>
  <!-- Google Fonts: Inter & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN para un diseño rápido, responsivo y ultra profesional -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0B2545',
              blue: '#134074',
              gold: '#D99B26',
              lightBlue: '#EEF4F8',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Transición suave general */
    * { transition: all 0.15s ease-out; }
  </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen text-gray-800 flex flex-col">

  <!-- ==========================================
       PANTALLA DE ACCESO (LOGIN)
       ========================================== -->
  <div id="loginSection" class="flex-grow flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 border border-gray-100">
      <div class="text-center mb-8">
        <h2 class="font-serif text-3xl font-bold text-brand-navy mb-2">La Caravana</h2>
        <p class="text-gray-500 text-sm">Panel de Administración de AltilloJVG</p>
      </div>
      <form id="loginForm" class="space-y-6">
        <div>
          <label for="adminPassword" class="block text-sm font-semibold text-gray-700 mb-2">Contraseña del Servidor</label>
          <input type="password" id="adminPassword" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-blue focus:border-brand-blue outline-none text-center tracking-widest text-lg" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full py-3 bg-brand-navy hover:bg-brand-blue text-white font-bold rounded-lg shadow-md hover:shadow-lg">
          Ingresar al Panel
        </button>
      </form>
    </div>
  </div>

  <!-- ==========================================
       CONSOLA PRINCIPAL (DASHBOARD)
       ========================================== -->
  <div id="dashboardSection" class="hidden flex-grow flex flex-col">
    <!-- Navbar -->
    <header class="bg-brand-navy text-white shadow-md">
      <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <span class="font-serif text-2xl font-bold tracking-tight">AltilloJVG <span class="text-brand-gold italic">Admin</span></span>
        </div>
        <div class="flex items-center gap-4">
          <span class="text-sm bg-brand-blue px-3 py-1.5 rounded-full font-medium" id="userBadge">La Caravana</span>
          <button id="logoutBtn" class="text-sm bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg font-bold">
            Salir
          </button>
        </div>
      </div>
    </header>

    <!-- Sub-Navbar / Tabs -->
    <div class="bg-white border-b border-gray-200">
      <div class="max-w-7xl mx-auto px-4 flex gap-6">
        <button id="tabApuntes" class="border-b-4 border-brand-navy text-brand-navy py-4 font-bold text-sm flex items-center gap-2">
          📚 Gestionar Apuntes
        </button>
        <button id="tabNoticias" class="border-b-4 border-transparent text-gray-400 py-4 font-semibold text-sm cursor-not-allowed flex items-center gap-2" disabled>
          📢 Tablón de Noticias <span class="bg-gray-100 text-gray-500 text-xs px-2 py-0.5 rounded-full font-bold">Próximamente</span>
        </button>
      </div>
    </div>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
      <!-- Filtros de Búsqueda -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Carrera / Profesorado</label>
            <select id="filterCarrera" class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-brand-blue outline-none text-sm font-semibold">
              <option value="">-- Todos --</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Año de Cursada</label>
            <select id="filterAnio" class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-brand-blue outline-none text-sm font-semibold">
              <option value="">-- Todos --</option>
              <option value="1° Año">1° Año</option>
              <option value="2° Año">2° Año</option>
              <option value="3° Año">3° Año</option>
              <option value="4° Año">4° Año</option>
              <option value="5° Año">5° Año</option>
              <option value="6° Año">6° Año</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Tipo de Apunte</label>
            <select id="filterTipo" class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-brand-blue outline-none text-sm font-semibold">
              <option value="">-- Todos --</option>
              <option value="Resumen">Resumen</option>
              <option value="Programa">Programa</option>
              <option value="1° Parcial">1° Parcial</option>
              <option value="2° Parcial">2° Parcial</option>
              <option value="Recuperatorio 1° Parcial">Recuperatorio 1° Parcial</option>
              <option value="Recuperatorio 2° Parcial">Recuperatorio 2° Parcial</option>
              <option value="Examen Final">Examen Final</option>
              <option value="Apunte">Apunte de Cátedra</option>
              <option value="Trabajo Práctico">Trabajo Práctico</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Buscador por Texto</label>
            <input type="text" id="searchKeyword" placeholder="Escribí materia o nombre..." class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-brand-blue outline-none text-sm">
          </div>
        </div>
      </div>

      <!-- Tabla de Datos -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
          <h3 class="font-bold text-brand-navy text-lg">Listado de Materiales Publicados</h3>
          <span class="text-sm font-medium text-gray-500" id="totalRecordsBadge">Cargando apuntes...</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-gray-50 text-gray-500 uppercase text-xs font-bold border-b border-gray-200">
                <th class="px-6 py-4">Materia / Carrera</th>
                <th class="px-6 py-4">Clasificación</th>
                <th class="px-6 py-4">Nombre / Título</th>
                <th class="px-6 py-4 text-center">Archivo</th>
                <th class="px-6 py-4 text-right">Acciones</th>
              </tr>
            </thead>
            <tbody id="materialsTableBody" class="divide-y divide-gray-200 text-sm">
              <!-- Cargado dinámicamente -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ==========================================
       MODAL DE EDICIÓN
       ========================================== -->
  <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full overflow-hidden border border-gray-100">
      <div class="bg-brand-navy text-white px-6 py-4 flex justify-between items-center">
        <h4 class="font-bold text-lg">Editar Apunte</h4>
        <button id="closeEditModalBtn" class="text-2xl hover:text-brand-gold">&times;</button>
      </div>
      <form id="editForm" class="p-6 space-y-4">
        <input type="hidden" id="editId">
        
        <div>
          <label for="editCarrera" class="block text-xs font-bold text-gray-500 uppercase mb-1">Carrera / Profesorado</label>
          <input type="text" id="editCarrera" readonly class="w-full px-3 py-2 rounded-lg border border-gray-200 bg-gray-100 font-semibold cursor-not-allowed text-sm">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="editAnio" class="block text-xs font-bold text-gray-500 uppercase mb-1">Año</label>
            <select id="editAnio" required class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-brand-blue outline-none text-sm">
              <option value="1° Año">1° Año</option>
              <option value="2° Año">2° Año</option>
              <option value="3° Año">3° Año</option>
              <option value="4° Año">4° Año</option>
              <option value="5° Año">5° Año</option>
              <option value="6° Año">6° Año</option>
            </select>
          </div>
          <div>
            <label for="editTipo" class="block text-xs font-bold text-gray-500 uppercase mb-1">Tipo</label>
            <select id="editTipo" required class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-brand-blue outline-none text-sm">
              <option value="Resumen">Resumen</option>
              <option value="Programa">Programa</option>
              <option value="1° Parcial">1° Parcial</option>
              <option value="2° Parcial">2° Parcial</option>
              <option value="Recuperatorio 1° Parcial">Recuperatorio 1° Parcial</option>
              <option value="Recuperatorio 2° Parcial">Recuperatorio 2° Parcial</option>
              <option value="Examen Final">Examen Final</option>
              <option value="Apunte">Apunte de Cátedra</option>
              <option value="Trabajo Práctico">Trabajo Práctico</option>
            </select>
          </div>
        </div>

        <div>
          <label for="editMateria" class="block text-xs font-bold text-gray-500 uppercase mb-1">Materia</label>
          <input type="text" id="editMateria" required class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-brand-blue outline-none text-sm">
        </div>

        <div>
          <label for="editNombre" class="block text-xs font-bold text-gray-500 uppercase mb-1">Nombre / Título del Apunte</label>
          <input type="text" id="editNombre" required class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-brand-blue outline-none text-sm">
        </div>

        <div>
          <label for="editLink" class="block text-xs font-bold text-gray-500 uppercase mb-1">Enlace de Descarga (Google Drive)</label>
          <input type="url" id="editLink" required class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-brand-blue outline-none text-sm">
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
          <button type="button" id="cancelEditBtn" class="px-4 py-2 border border-gray-300 hover:bg-gray-50 font-bold rounded-lg text-sm">
            Cancelar
          </button>
          <button type="submit" class="px-4 py-2 bg-brand-navy hover:bg-brand-blue text-white font-bold rounded-lg text-sm">
            Guardar Cambios
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="data/aulas_data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
