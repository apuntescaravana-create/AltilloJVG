name: Actualizar Aulas JVG

on:
  schedule:
    - cron: '0 4 * * 1' # Todos los lunes a las 4:00 AM UTC (1:00 AM hora Argentina)
  workflow_dispatch: # Permite ejecución manual desde la web de GitHub o API
  repository_dispatch:
    types: [sync_aulas]

jobs:
  update-aulas:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pdfplumber

    - name: Run update script
      run: python scripts/auto_update_aulas.py

    - name: Commit and push changes
      run: |
        git config --global user.name "Github Action Bot"
        git config --global user.email "actions@github.com"
        git add data/aulas_data.js data/aulas_data.json
        if git diff --staged --quiet; then
          echo "No hay cambios en las aulas."
        else
          git commit -m "Chore: Auto-update classrooms database from official site [skip ci]"
          git push
        fi
